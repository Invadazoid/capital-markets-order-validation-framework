name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      distribution:
        required: false
        default: 'temurin'
        description: 'JDK distribution for setup-java (e.g. temurin, zulu)'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: captest
          POSTGRES_USER: capuser
          POSTGRES_PASSWORD: cap@123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U capuser -d captest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start WireMock container
        run: |
          docker run -d --name wiremock \
            -p 8080:8080 \
            -v "${{ github.workspace }}/wiremock:/home/wiremock" \
            wiremock/wiremock:2.35.0 \
            --root-dir /home/wiremock --verbose
          echo "Waiting for WireMock to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/__admin/mappings >/dev/null 2>&1; then
              echo "WireMock is up."
              break
            fi
            sleep 1
          done

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: ${{ github.event.inputs.distribution || 'temurin' }}

      - name: Set up Node.js (for frontend / static server and Playwright if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps (psql, jq, wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq wget

      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: cap@123
        run: |
          echo "Waiting for Postgres to accept connections..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U capuser -d captest && break
            echo "Waiting for postgres... ($i)"
            sleep 5
          done
          pg_isready -h localhost -p 5432 -U capuser -d captest

      - name: Wait for WireMock mappings
        run: |
          for i in $(seq 1 30); do
            MAPPINGS=$(curl -s http://localhost:8080/__admin/mappings 2>/dev/null || true)
            if [ -n "$MAPPINGS" ] && echo "$MAPPINGS" | jq '.mappings | length' 2>/dev/null | grep -qv '^0$'; then
              echo "WireMock is ready with mappings loaded."
              curl -s http://localhost:8080/__admin/mappings | jq '.'
              break
            fi
            echo "Waiting for WireMock... ($i)"
            sleep 2
          done

      - name: Serve frontend demo UI
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
            npm run build
            npx http-server dist -p 3000 -c-1 &
            cd -
          else
            echo "No frontend folder found; skipping UI serve."
          fi

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 >/dev/null 2>&1; then
              echo "Frontend is ready."
              break
            fi
            echo "Waiting for frontend... ($i)"
            sleep 1
          done

      - name: Apply DB schema & seed (prefer repo files)
        env:
          PGPASSWORD: cap@123
        run: |
          if [ -f db/schema.sql ]; then
            echo "Applying db/schema.sql"
            psql -h localhost -U capuser -d captest -f db/schema.sql || { echo "Schema application failed"; exit 1; }
          else
            echo "db/schema.sql not found — creating minimal orders table"
            psql -h localhost -U capuser -d captest -c "CREATE TABLE IF NOT EXISTS orders (id serial PRIMARY KEY, order_id varchar(50) UNIQUE, symbol varchar(10), qty int, status varchar(20), created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)"
          fi
          if [ -f db/seed.sql ]; then
            echo "Applying db/seed.sql"
            psql -h localhost -U capuser -d captest -f db/seed.sql
          fi

      - name: Install Chromium and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          # ensure chromedriver is in expected path
          if [ ! -f /usr/lib/chromium-browser/chromedriver ]; then
            sudo mkdir -p /usr/lib/chromium-browser
            sudo ln -sf $(which chromedriver) /usr/lib/chromium-browser/chromedriver || true
          fi
          # expose CHROME binary env var
          echo "CHROME_BIN=$(which chromium-browser || which chromium)" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=/usr/lib/chromium-browser/chromedriver" >> $GITHUB_ENV

      - name: Run Maven tests (API + UI where applicable)
        env:
          PGPASSWORD: cap@123
        run: |
          mvn -B -DskipTests=false test \
            -Ddb.url=jdbc:postgresql://localhost:5432/captest \
            -Ddb.user=capuser \
            -Ddb.password=cap@123 \
            -Dwiremock.base=http://localhost:8080 \
            -Dui.url=http://localhost:3000

      - name: Generate Allure report
        if: always()
        run: mvn --no-transfer-progress allure:report

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn

      - name: Stop WireMock container
        if: always()
        run: docker stop wiremock && docker rm wiremock || true
